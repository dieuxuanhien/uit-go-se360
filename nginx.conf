worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Connection pooling - CRITICAL for high concurrency
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    # Buffers for better performance
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Timeouts - prevent cascading failures
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Load balancing upstreams with ALL replicas
    upstream user-service {
        least_conn;
        server user-service:3001 max_fails=3 fail_timeout=10s;
        server user-service-2:3001 max_fails=3 fail_timeout=10s backup;
        keepalive 32;
    }
    
    upstream trip-service {
        least_conn;
        server trip-service:3002 max_fails=3 fail_timeout=10s;
        server trip-service-2:3002 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }
    
    upstream driver-service {
        least_conn;
        server driver-service:3003 max_fails=3 fail_timeout=10s;
        server driver-service-2:3003 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        
        # Enable TCP keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Health checks for all services
        location /users/health {
            proxy_pass http://user-service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /trips/health {
            proxy_pass http://trip-service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /drivers/health {
            proxy_pass http://driver-service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # User Service routes
        location /users/ {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Trip Service routes - HIGHEST TRAFFIC
        location /trips {
            proxy_pass http://trip-service/trips;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Longer timeout for trip creation (involves driver search)
            proxy_read_timeout 60s;
        }
   
        location /notifications {
            proxy_pass http://trip-service/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Driver Service routes
        location /drivers/ {
            proxy_pass http://driver-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}