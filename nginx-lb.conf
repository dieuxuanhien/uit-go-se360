# nginx-lb.conf
# DNS-based Load Balancer for UIT-GO microservices
# Uses Docker's internal DNS resolver for auto-discovery of replicas
#
# How it works:
# - Docker DNS returns ALL container IPs for a service name
# - nginx resolves DNS on each request (with short TTL)
# - New containers are automatically discovered
# - Removed containers are automatically dropped

events {
    worker_connections 4096;
}

http {
    # Logging format with upstream info
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent '
                           'upstream: $upstream_addr rt: $upstream_response_time';

    access_log /var/log/nginx/access.log upstream_log;

    # Connection settings
    keepalive_timeout 65;
    keepalive_requests 1000;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # DNS Resolver Configuration
    # Docker's internal DNS server (127.0.0.11)
    # valid=10s: Re-resolve DNS every 10 seconds
    # ipv6=off: Disable IPv6 lookups for speed
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # Health check endpoint
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        location = /health {
            return 200 'nginx-lb: OK\n';
            add_header Content-Type text/plain;
        }

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # User Service routes (port 3001) - DNS Load Balanced
        # Uses Docker service name: tasks.user-service
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        location /users {
            # Variable forces DNS resolution on each request
            set $user_backend "user-service:3001";
            # Use $uri to preserve full path (e.g., /users/me, /users/login)
            proxy_pass http://$user_backend$uri$is_args$args;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            add_header X-Upstream-Server $upstream_addr;
        }

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # Trip Service routes (port 3002) - DNS Load Balanced
        # This is the critical path - needs load balancing most
        # NOTE: Using $uri preserves the full path (e.g., /trips/abc-123)
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        location /trips {
            set $trip_backend "trip-service:3002";
            # Use $uri to preserve full path including trip ID
            proxy_pass http://$trip_backend$uri$is_args$args;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            add_header X-Upstream-Server $upstream_addr;
        }

        location /notifications {
            set $trip_backend "trip-service:3002";
            # Use $uri to preserve full path
            proxy_pass http://$trip_backend$uri$is_args$args;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # Driver Service routes (port 3003) - DNS Load Balanced
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        location /drivers {
            set $driver_backend "driver-service:3003";
            # Use $uri to preserve full path (e.g., /drivers/location, /drivers/search)
            proxy_pass http://$driver_backend$uri$is_args$args;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            add_header X-Upstream-Server $upstream_addr;
        }
    }
}
