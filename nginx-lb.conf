# nginx-lb.conf
# High-Performance Load Balancer for UIT-GO microservices
# Optimized for 500+ VUs with connection pooling
#
# CRITICAL: Uses upstream blocks with keepalive for connection reuse
# Variable-based DNS resolution is SLOW and breaks keepalive

worker_processes auto;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    # Logging format with upstream info
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent '
                           'upstream: $upstream_addr rt: $upstream_response_time';

    access_log /var/log/nginx/access.log upstream_log;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Connection pooling - CRITICAL for high concurrency
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    keepalive_timeout 65;
    keepalive_requests 10000;
    
    # Buffer sizes for better throughput
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # DNS Resolver for dynamic backends
    # Shorter TTL (2s) for faster auto-scaler replica discovery
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 3s;

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Upstream pools with keepalive connections
    # MUST use upstream blocks for keepalive to work!
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    upstream user_backend {
        least_conn;
        server user-service:3001 max_fails=3 fail_timeout=10s;
        server user-service-2:3001 max_fails=3 fail_timeout=10s backup;
        keepalive 32;
    }
    
    upstream trip_backend {
        least_conn;
        server trip-service:3002 max_fails=3 fail_timeout=10s;
        server trip-service-2:3002 max_fails=3 fail_timeout=10s;
        keepalive 128;  # Higher for trip-service (most traffic)
    }
    
    upstream driver_backend {
        least_conn;
        server driver-service:3003 max_fails=3 fail_timeout=10s;
        server driver-service-2:3003 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        
        # Timeouts - prevent cascading failures
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # Health check endpoint
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        location = /health {
            return 200 'nginx-lb: OK\n';
            add_header Content-Type text/plain;
        }

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # User Service routes (port 3001)
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        location /users {
            proxy_pass http://user_backend;
            
            # Enable keepalive - MUST set these headers!
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            add_header X-Upstream-Server $upstream_addr;
        }

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # Trip Service routes (port 3002) - CRITICAL PATH
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        location /trips {
            proxy_pass http://trip_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Longer timeout for trip creation (calls driver-service)
            proxy_read_timeout 60s;
            
            add_header X-Upstream-Server $upstream_addr;
        }

        location /notifications {
            proxy_pass http://trip_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # Driver Service routes (port 3003)
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        location /drivers {
            proxy_pass http://driver_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            add_header X-Upstream-Server $upstream_addr;
        }
    }
}
