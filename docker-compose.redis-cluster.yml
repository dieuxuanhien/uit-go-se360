  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Redis Cluster Initializer
  # Waits for all nodes to be healthy, then creates cluster
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
  redis-cluster-init:
    image: redis:7-alpine
    container_name: uitgo-redis-cluster-init
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    networks:
      - uitgo-network
    command:
      - sh
      - -c
      - |
        echo '⏳ Waiting for Redis nodes to be ready...'
        sleep 5
        echo '🔧 Creating Redis Cluster (3 primaries + 3 replicas)...'
        redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 redis-node-4:6379 redis-node-5:6379 redis-node-6:6379 --cluster-replicas 1 --cluster-yes
        echo '✅ Redis Cluster initialized successfully!'
        echo '📊 Cluster status:'
        redis-cli -h redis-node-1 cluster info

volumes:
  redis-node-1-data:
    driver: local
  redis-node-2-data:
    driver: local
  redis-node-3-data:
    driver: local
  redis-node-4-data:
    driver: local
  redis-node-5-data:
    driver: local
  redis-node-6-data:
    driver: local

networks:
  uitgo-network:
    external: true
