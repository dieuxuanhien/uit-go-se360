# Redis Cluster Configuration for Story 2.3: Distributed Caching
# 6-node Redis Cluster (3 primaries + 3 replicas)
# Target: 90% cache hit rate, 10x database load reduction

version: '3.8'

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Redis Cluster Nodes (3 primaries + 3 replicas)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
  redis-node-1:
    image: redis:7-alpine
    container_name: uitgo-redis-node-1
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes-1.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - '7000:6379'
      - '17000:16379'
    volumes:
      - redis-node-1-data:/data
    networks:
      - uitgo-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

